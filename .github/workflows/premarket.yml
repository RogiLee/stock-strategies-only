name: Premarket Night Session

on:
  schedule:
    # 台灣時間 08:00 = UTC 00:00（夜盤 05:00 收完、開盤 09:00 前）
    - cron: '0 0 * * 1-5'
    # Temporary automatic-trigger verification; remove after the scheduled run.
    - cron: '53 0 22 10 *'
  workflow_dispatch:  # 允許手動觸發測試

jobs:
  run-premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: uv sync --extra pdf

      - name: Install PDF browser and Chinese fonts
        run: |
          uv run --extra pdf playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Run premarket report
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PDF_REPORT_ENABLED: "true"
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: uv run --extra pdf python premarket.py
